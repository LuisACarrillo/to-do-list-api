name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip repository
        run: git archive --format=zip --prefix=to-do-list-api/ -o to-do-list-api.zip HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" to-do-list-api.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
