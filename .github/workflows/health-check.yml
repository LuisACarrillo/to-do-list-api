name: health-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: health
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Check /health
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-list-api" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "No hay una instancia todo-list-api en ejecución."
            exit 1
          fi
          BODY=$(curl -fsS "http://${IP}:8000/health")
          echo "$BODY"
          python3 -c 'import json,sys; body=json.loads(sys.argv[1]); assert body.get("status")=="OK", body' "$BODY"
